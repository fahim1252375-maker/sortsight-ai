services:
  sortsight-web:
    build: .
    container_name: sortsight-ai
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random value of at least 32 characters}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY to 64 hexadecimal characters}
      DATABASE_PATH: /app/data/sortsight.db
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      PLC_GATEWAY_MODE: ${PLC_GATEWAY_MODE:-simulator}
    volumes:
      - sortsight_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sortsight_data:
